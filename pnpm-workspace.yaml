# Dependencies allowed to run their install script, and no others. esbuild and workerd each
# fetch their platform's binary in one; the Durable Objects tests (test/do/) need both.
allowBuilds:
  esbuild: true
  workerd: true
# The author's own scope is let past pnpm's release-age gate, which holds back any version
# under a day old: a release of one of these packages installs the day it is published.
# Every other scope stays gated.
minimumReleaseAgeExclude:
  - '@marianmeres/*'
